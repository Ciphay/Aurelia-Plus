[package]
name = "aurelia-steam"
version = "0.2.5"
edition = "2024"
description = "Aurelia CLI Steam launcher"
license = "GPL-3.0-or-later"
repository = "https://github.com/Drackrath/Aurelia"
exclude = [".github/", "scripts/", "flake.nix", "flake.lock"]

[lib]
name = "aurelia"
path = "src/lib.rs"

[[bin]]
name = "aurelia"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
directories = "6"
rpassword = "7"
keyvalues-serde = "0.2"
prost = "0.13"
protobuf = "3.5"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steam-vdf-parser = "0.1.1"
steam-vent = { package = "aurelia-steam-vent", version = "0.7.2" }
steam-vent-proto = "=0.5.2"
steam-vent-proto-common = "0.5.1"
steam-vent-chat = { package = "aurelia-steam-vent-chat", version = "0.8.0" }
steamid-ng = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "net", "io-util", "sync", "io-std", "process", "signal"] }
futures-util = "0.3"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
walkdir = "2"
filetime = "0.2"
zip = "2.2.2"
tar = "0.4"
hex = "0.4"
sha1 = "0.10"
rsa = "0.9"
flate2 = "1"
xz2 = "0.1"
zstd = "0.13"
crc32fast = "1"
cbc = "0.1"
aes = "0.8"
steam-cdn = { package = "aurelia-steam-cdn", version = "3.2.1" }
libc = "0.2"
regex = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
qrcode = { version = "0.14", default-features = false }
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = "1"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }
ed25519-dalek = "2"

[build-dependencies]
protobuf-codegen = "3.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[patch.crates-io]
aurelia-steam-vent = { path = "vendor/aurelia-steam-vent" }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dev-dependencies]
tempfile = "3"
http = "1"

[package.metadata.deb]
name = "aurelia"
maintainer = "Aurelia Contributors"
copyright = "2026, Aurelia Contributors"
license-file = "LICENSE"
section = "games"
priority = "optional"
depends = "$auto, libssl3"
assets = [
    ["target/release/aurelia", "usr/bin/aurelia", "755"],
]
